[project]
name = "memory-transformer"
version = "0.1.0"
description = "A recurrent Transformer with globally shared routed FFN and attention memory"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "numpy>=1.26",
  "modelscope>=1.20",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["temp"]
