[project]
name = "memory-transformer"
version = "0.1.0"
description = "A recurrent Transformer with globally shared routed FFN and attention memory"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["temp"]
